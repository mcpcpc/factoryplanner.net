name: Report a problem
description: Something in the app at app.factoryplanner.net isn't working.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issues here are **public**. Leave out client names, addresses, layout names, drawings and confidential floor plans.

        Reporting from the app fills in the version and your browser for you.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a layout
        2. …
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of the account menu.
      placeholder: v1.26.2
  - type: textarea
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 131 on Windows 11
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: If the app showed one.
      render: text
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots
      description: Drag images here if they help show the problem. Crop out anything confidential.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I've left out anything I don't want made public.
          required: true
