name: Request a feature
description: Suggest something the app could do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Issues here are **public**. Leave out client names, addresses and confidential floor plans.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working, if you have an idea.
